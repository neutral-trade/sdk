<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neutral Trade widget vanilla example</title>
    <style>
      body { background: #f3f4f6; color: #111827; font: 16px/1.5 system-ui, sans-serif; margin: 0; }
      main { margin: 0 auto; max-width: 1080px; padding: 32px 20px; }
      .controls { display: flex; gap: 12px; margin-bottom: 20px; }
      button, select { border: 1px solid #d1d5db; border-radius: 8px; font: inherit; padding: 10px 12px; }
      button { background: #111827; color: white; cursor: pointer; }
      #widget { background: white; border-radius: 16px; min-height: 720px; overflow: hidden; }
      pre { background: #111827; border-radius: 8px; color: #d1fae5; min-height: 80px; overflow: auto; padding: 12px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Neutral Trade widget</h1>
      <p>Append <code>?builderAddress=&lt;registered-wallet&gt;</code> to use raw address attribution instead of the default <code>ACME</code> builder code.</p>
      <div class="controls">
        <select id="wallet" aria-label="Wallet"></select>
        <button id="connect" type="button">Connect and mount</button>
      </div>
      <div id="widget"></div>
      <h2>Lifecycle events</h2>
      <pre id="events">Waiting for a wallet…</pre>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
