catalogMode: prefer

ignoreWorkspaceRootCheck: true

shellEmulator: true

supportedArchitectures:
  cpu: [x64, arm64]
  libc: [glibc, musl]
  os: [linux, win32, darwin]

trustPolicy: no-downgrade

packages:
  - playground
  - docs
  - packages/*
  - examples/*

overrides:
  '@noble/ed25519': ^2.0.0
  axios: '>=0.30.0'
  form-data: '>=4.0.4'
  js-yaml: '>=4.1.1'
  nanoid: '>=3.3.8'

catalog:
  '@coral-xyz/anchor': 0.32.0
  '@solana/spl-token': ^0.4.14
  '@solana/web3.js': ^1.98.4
  '@types/bn.js': ^5.2.0
  baseline-browser-mapping: ^2.11.21
  bn.js: ^5.2.3
  dotenv: ^17.4.2
  typedoc: ^0.28.20
  zod: ^4.5.4

catalogs:
  cli:
    '@antfu/eslint-config': ^6.7.3
    '@antfu/ni': ^28.3.0
    bumpp: ^10.4.1
    eslint: ^9.39.5
    lint-staged: ^16.4.0
    publint: ^0.3.24
    simple-git-hooks: ^2.14.0
    tsdown: ^0.17.4
    tsx: ^4.23.13
    typescript: ^5.9.3
    vite: ^7.3.6
  inlined:
    '@antfu/utils': ^9.3.0
  testing:
    tinyexec: ^1.3.1
    vitest: ^4.1.11
    vitest-package-exports: ^0.1.1
    yaml: ^2.9.0
  types:
    '@types/node': ^25.9.5

onlyBuiltDependencies:
  - esbuild
  - simple-git-hooks

trustedDependencies:
  - '@noble/ed25519'
