name: Sync vault registry

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

# The PR is pushed and opened with NT_BOT_TOKEN, so GITHUB_TOKEN only needs to read.
permissions:
  contents: read

concurrency:
  group: sync-vault-registry
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm i -g @antfu/ni
      - run: nci
      - id: sync
        run: nr sync:registry
        env:
          INDEXER_API_URL: ${{ secrets.INDEXER_API_URL }}
          INDEXER_API_KEY: ${{ secrets.INDEXER_API_KEY }}
      - run: nr generate

      # Creates the sync PR, or updates the open one on the same branch; no diff means no PR.
      - uses: peter-evans/create-pull-request@v7
        with:
          # Deliberately NOT GITHUB_TOKEN: PRs opened with it do not trigger CI, and the
          # org policy blocks GitHub Actions from creating PRs.
          token: ${{ secrets.NT_BOT_TOKEN }}
          branch: chore/sync-vault-registry
          delete-branch: true
          commit-message: 'chore(registry): sync vault registry from indexer'
          title: 'chore(registry): sync vault registry from indexer'
          body: |
            Automated sync of `src/registry/vaults.json` from the bundle indexer `/v2/vaults`, with the `VaultId` enums regenerated.

            New vaults are added with `pointsEnabled: false`. Do not push edits to this branch: it is regenerated from `main` every hour and edits are overwritten. Enable points in a follow-up PR after merging.
          add-paths: |
            src/registry/vaults.json
            src/constants/vault-ids.ts
            src/constants/vault-ids.devnet.ts

      # Skipped rows need a human (mistyped legacy_vault_id, unsupported category, ...). Fail after
      # the PR step so the other updates still land; the run summary lists the rows.
      - if: steps.sync.outputs.skipped != '0'
        env:
          SKIPPED: ${{ steps.sync.outputs.skipped }}
        run: |
          echo "::error::$SKIPPED indexer vault(s) skipped; see the run summary"
          exit 1
