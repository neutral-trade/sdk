name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm i -g @antfu/ni
      - run: nci
      - run: nr lint
      - run: nr typecheck
      # Build the SDK so the CLI can resolve its emitted dist types, then
      # typecheck the CLI (it consumes @neutral-trade/sdk and its ./idl subpath;
      # `pnpm -r` skips the workspace-root SDK, so target the CLI explicitly).
      - run: nr build
      - run: pnpm --filter @neutral-trade/cli typecheck
      # The widget package has browser and React entry points outside the root
      # tsconfig, and each example checks its integration surface independently.
      - run: pnpm --filter @neutral-trade/widget-sdk typecheck
      - run: pnpm --filter @neutral-trade/example-widget-vanilla typecheck
      - run: pnpm --filter @neutral-trade/example-widget-react typecheck

  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        node: [lts/*]
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Set node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm i -g @antfu/ni
      - run: nci
      - run: nr build
      # Build the CLI too (after the SDK) so a CLI that no longer builds
      # against the SDK fails CI.
      - run: pnpm --filter @neutral-trade/cli build
      # Exercise the separately published widget artefacts and both framework
      # integrations on every supported CI operating system.
      - run: pnpm --filter @neutral-trade/widget-sdk test
      - run: pnpm --filter @neutral-trade/widget-sdk build
      - run: pnpm --filter @neutral-trade/example-widget-vanilla build
      - run: pnpm --filter @neutral-trade/example-widget-react build
      - run: nr test
